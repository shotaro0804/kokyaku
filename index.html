<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<title>導入実績マップ</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="./map-data.js"></script>
<style>
:root{
  --ink:#0d1117; --gold:#c9a227; --line:#2a3441; --dim:#8b95a3;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;background:var(--ink)}
#map{position:absolute;inset:0}

#hdr{
  position:absolute;top:0;left:0;right:0;z-index:5;
  padding:calc(env(safe-area-inset-top) + 14px) 18px 16px;
  background:linear-gradient(180deg,rgba(13,17,23,.96) 0%,rgba(13,17,23,.8) 62%,rgba(13,17,23,0) 100%);
  pointer-events:none;
}
#brand{font-size:11px;font-weight:800;letter-spacing:.34em;color:var(--gold);margin-bottom:7px;
  text-transform:uppercase;opacity:0;animation:fade .7s .2s forwards}
#hero{display:flex;align-items:baseline;gap:9px;opacity:0;animation:fade .7s .45s forwards}
#big{font-size:52px;font-weight:800;color:#fff;line-height:.92;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
#unit{font-size:19px;font-weight:700;color:#fff}
#tag{font-size:12.5px;color:var(--dim);margin-top:9px;opacity:0;animation:fade .7s .8s forwards}
@keyframes fade{to{opacity:1}}

#ctl{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom) + 26px);z-index:6;
  display:flex;flex-direction:column;gap:8px;opacity:0;animation:fade .8s 1.4s forwards}
.cb{width:46px;height:46px;border-radius:23px;border:1px solid var(--line);
  background:rgba(19,26,36,.92);backdrop-filter:blur(10px);color:#fff;font-size:17px;
  font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cb:active{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.cb.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}

#hint{
  position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:5;
  text-align:center;font-size:11px;color:var(--dim);letter-spacing:.06em;
  opacity:0;animation:fade .8s 2s forwards;pointer-events:none;
}

/* 名前カード */
#card{
  position:absolute;left:14px;right:76px;bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:7;
  background:rgba(19,26,36,.97);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:11px;padding:14px 16px;
  transform:translateY(24px);opacity:0;transition:all .22s ease;pointer-events:none;
}
#card.up{transform:translateY(0);opacity:1;pointer-events:auto}
#card .nm{font-size:16px;font-weight:800;color:#fff;line-height:1.35}
#card .lb{font-size:9px;letter-spacing:.2em;color:var(--gold);font-weight:700;margin-bottom:6px}
#card .x{position:absolute;top:8px;right:11px;color:var(--dim);font-size:19px;
  background:none;border:none;cursor:pointer;line-height:1}

#boot{position:absolute;inset:0;z-index:20;background:var(--ink);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  transition:opacity .8s ease}
#boot.gone{opacity:0;pointer-events:none}
#bootN{font-size:76px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;
  letter-spacing:-.03em;line-height:1}
#bootT{font-size:11px;letter-spacing:.3em;color:var(--gold);margin-top:14px;font-weight:700}
</style>
</head>
<body>

<div id="map"></div>

<div id="hdr">
  <div id="brand">Raizon</div>
  <div id="hero"><div id="big">0</div><div id="unit">社</div></div>
  <div id="tag">九州・中国地方でご利用いただいています</div>
</div>

<div id="ctl">
  <button class="cb" id="bFit" title="全体">⛶</button>
  <button class="cb" id="bHeat" title="密度">◉</button>
</div>

<div id="hint">ピンをタップすると会社名が出ます</div>

<div id="card">
  <button class="x" id="cardX">×</button>
  <div class="lb">導入先</div>
  <div class="nm" id="cardN"></div>
</div>

<div id="boot">
  <div id="bootN">0</div>
  <div id="bootT">導入実績</div>
</div>

<script>
const D = window.SHOPS || [];
const $ = id=>document.getElementById(id);
const nAll = D.length;

function countTo(el,target,ms){
  const t0=performance.now();
  (function s(now){
    const p=Math.min(1,(now-t0)/ms), e=1-Math.pow(1-p,3);
    el.textContent=Math.round(target*e).toLocaleString();
    if(p<1) requestAnimationFrame(s);
  })(t0);
}
countTo($('bootN'), nAll, 1400);

const map=new maplibregl.Map({
  container:'map',
  style:{version:8,
    sources:{
      base:{type:'raster',
        tiles:['https://cyberjapandata.gsi.go.jp/xyz/dark/{z}/{x}/{y}.png'],
        tileSize:256,maxzoom:16,
        attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>'},
      pale:{type:'raster',
        tiles:['https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png'],
        tileSize:256,maxzoom:18}
    },
    layers:[
      {id:'bg',type:'raster',source:'base',paint:{'raster-opacity':.85,'raster-saturation':-.5}},
      {id:'bg2',type:'raster',source:'pale',minzoom:13,
        paint:{'raster-opacity':['interpolate',['linear'],['zoom'],13,0,16,.6],
               'raster-saturation':-.7,'raster-brightness-max':.6}}
    ]},
  center:[130.9,32.6], zoom:5.2, maxZoom:18, minZoom:4,
  attributionControl:false
});
map.addControl(new maplibregl.AttributionControl({compact:true}),'top-right');

// 地理院タイルが読めない環境では OSM に切り替える
let tileErr=0, swapped=false;
map.on('error', e=>{
  const msg=String(e && e.error && e.error.message || '');
  if(msg.includes('tile') || (e.sourceId==='base'||e.sourceId==='pale')) tileErr++;
  if(tileErr>4 && !swapped){
    swapped=true;
    try{
      map.getSource('base').setTiles(['https://tile.openstreetmap.org/{z}/{x}/{y}.png']);
      map.setPaintProperty('bg','raster-saturation',-.85);
      map.setPaintProperty('bg','raster-brightness-max',.45);
      if(map.getLayer('bg2')) map.setLayoutProperty('bg2','visibility','none');
    }catch(err){}
  }
});

let heat=false;

function fc(){
  return {type:'FeatureCollection',features:D.map((d,ix)=>({
    type:'Feature',geometry:{type:'Point',coordinates:d.c},
    properties:{n:d.n, ord:ix}
  }))};
}

function setupLayers(){
  if(map.getSource('p')) return;
  map.addSource('p',{type:'geojson',data:fc()});

  map.addLayer({id:'heat',type:'heatmap',source:'p',layout:{visibility:'none'},
    paint:{'heatmap-weight':.6,
      'heatmap-intensity':['interpolate',['linear'],['zoom'],4,.9,10,2.2],
      'heatmap-radius':['interpolate',['linear'],['zoom'],4,14,8,30,12,52],
      'heatmap-opacity':.82,
      'heatmap-color':['interpolate',['linear'],['heatmap-density'],
        0,'rgba(0,0,0,0)',.18,'rgba(70,90,140,.55)',.38,'rgba(90,150,160,.72)',
        .58,'rgba(190,170,70,.85)',.78,'rgba(215,125,55,.92)',1,'rgba(230,80,60,.98)']}});

  map.addLayer({id:'glow',type:'circle',source:'p',
    paint:{'circle-color':'#c9a227',
      'circle-radius':['interpolate',['linear'],['zoom'],5,7,9,13,14,22],
      'circle-opacity':.15,'circle-blur':1}});

  map.addLayer({id:'dot',type:'circle',source:'p',
    paint:{'circle-color':'#e8c34a',
      'circle-radius':['interpolate',['linear'],['zoom'],4,2.2,6,3.4,9,5.2,12,7.5,17,12],
      'circle-opacity':.96,
      'circle-stroke-width':['interpolate',['linear'],['zoom'],8,0,12,1.3],
      'circle-stroke-color':'rgba(255,255,255,.6)'}});

  map.addLayer({id:'sel',type:'circle',source:'p',filter:['==','ord',-1],
    paint:{'circle-color':'#fff','circle-radius':13,'circle-opacity':.28,'circle-blur':.5}});

  map.on('click','dot',e=>{
    const f=e.features[0];
    $('cardN').textContent=f.properties.n;
    $('card').classList.add('up');
    map.setFilter('sel',['==','ord',f.properties.ord]);
  });
  map.on('mouseenter','dot',()=>map.getCanvas().style.cursor='pointer');
  map.on('mouseleave','dot',()=>map.getCanvas().style.cursor='');
}

/* 起動処理。地図タイルが読めなくても必ず進む。 */
let started=false;
function start(){
  if(started) return;
  started=true;
  try{ setupLayers(); }catch(e){ console.error('layer error',e); }
  $('boot').classList.add('gone');
  countTo($('big'), nAll, 1600);
  try{
    reveal();
    map.easeTo({center:[130.75,32.9],zoom:6.5,duration:3200,essential:true});
  }catch(e){ console.error('anim error',e); }
}

// 通常ルート：地図の準備ができ次第
if(map.loaded()) setTimeout(start,1750);
else map.on('load',()=>setTimeout(start,1750));
// 保険：タイルが読めなくても4秒で必ず起動する
setTimeout(start,4000);

function reveal(){
  const total=1500,t0=performance.now();
  (function s(now){
    const p=Math.min(1,(now-t0)/total);
    const n=Math.floor(nAll*(1-Math.pow(1-p,2)));
    if(map.getLayer('dot')){
      map.setFilter('dot',['<',['get','ord'],n]);
      map.setFilter('glow',['<',['get','ord'],n]);
    }
    if(p<1) requestAnimationFrame(s);
    else if(map.getLayer('dot')){ map.setFilter('dot',null); map.setFilter('glow',null); }
  })(t0);
}

$('cardX').onclick=()=>{
  $('card').classList.remove('up');
  if(map.getLayer('sel')) map.setFilter('sel',['==','ord',-1]);
};
$('bFit').onclick=()=>{
  const b=new maplibregl.LngLatBounds();
  D.forEach(d=>b.extend(d.c));
  map.fitBounds(b,{padding:{top:150,bottom:90,left:30,right:30},duration:1100});
};
$('bHeat').onclick=()=>{
  if(!map.getLayer('heat')) return;
  heat=!heat;
  map.setLayoutProperty('heat','visibility',heat?'visible':'none');
  ['dot','glow','sel'].forEach(l=>{
    if(map.getLayer(l)) map.setLayoutProperty(l,'visibility',heat?'none':'visible');
  });
  $('bHeat').classList.toggle('on',heat);
  $('card').classList.remove('up');
};
</script>
</body>
</html>
